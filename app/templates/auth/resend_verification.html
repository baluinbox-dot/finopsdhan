{% extends "base.html" %}
{% block title %}Resend Verification — FinOps Dhan Algo{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="card stat-card auth-card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-envelope-check text-primary" style="font-size: 2rem;"></i>
                <h4 class="mt-2 mb-0">Resend Verification Email</h4>
            </div>
            <form method="post" action="{{ url('/auth/resend-verification') }}">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" value="{{ email }}" class="form-control" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary w-100">Resend Link</button>
            </form>
            <p class="mt-3 mb-0 small text-body-secondary text-center"><a href="{{ url('/auth/login') }}">Back to login</a></p>
        </div>
    </div>
</div>
{% endblock %}
