{% extends "base.html" %}
{% block title %}Register — FinOps Dhan Algo{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="card stat-card auth-card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock text-primary" style="font-size: 2rem;"></i>
                <h4 class="mt-2 mb-0">Create Account</h4>
            </div>
            <form method="post" action="{{ url('/auth/register') }}">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" minlength="8" required>
                    <div class="form-text">At least 8 characters.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" minlength="8" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">What is {{ captcha_a }} + {{ captcha_b }}?</label>
                    <input type="text" inputmode="numeric" name="captcha_answer" class="form-control" required>
                </div>
                <button id="registerBtn" type="submit" class="btn btn-primary w-100">Create Account</button>
            </form>
            <p class="mt-3 mb-0 small text-body-secondary text-center">Already have an account? <a href="{{ url('/auth/login') }}">Log in</a>.</p>
        </div>
    </div>
</div>
{% endblock %}
