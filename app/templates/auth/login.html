{% extends "base.html" %}
{% block title %}Login — FinOps Dhan Algo{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="card stat-card auth-card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-graph-up-arrow text-primary" style="font-size: 2rem;"></i>
                <h4 class="mt-2 mb-0">Welcome Back</h4>
            </div>
            <form method="post" action="{{ url('/auth/login') }}">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                    <div class="text-end mt-1">
                        <a href="{{ url('/auth/forgot-password') }}" class="small">Forgot password?</a>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">What is {{ captcha_a }} + {{ captcha_b }}?</label>
                    <input type="text" inputmode="numeric" name="captcha_answer" class="form-control" required>
                </div>
                <button id="loginBtn" type="submit" class="btn btn-primary w-100">Log In</button>
            </form>
            <p class="mt-3 mb-0 small text-body-secondary text-center">No account? <a href="{{ url('/auth/register') }}">Register here</a>.</p>
        </div>
    </div>
</div>
{% endblock %}
