services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops
      POSTGRES_DB: finopstrading
    ports:
      # Bound to localhost only — nothing outside this machine needs direct DB access.
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops -d finopstrading"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://finops:finops@db:5432/finopstrading
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound to localhost only — the host's web server (Apache/Nginx, whichever
      # already owns port 80) reverse-proxies to this; the app is never exposed
      # directly to the public internet.
      - "127.0.0.1:${APP_HOST_PORT:-8000}:8000"
    volumes:
      - .:/app

volumes:
  pgdata:
